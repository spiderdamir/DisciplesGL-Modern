name: Build & Release DisciplesGL-Modern

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  build:
    name: Build C4dll-R.dll (Win32 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Integrate vcpkg
        shell: cmd
        run: |
          vcpkg integrate install

      - name: Patch RC files if needed (afxres.h -> winres.h)
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter "*.rc" -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'afxres\.h') {
              Write-Host "Patching afxres.h -> winres.h in $($_.FullName)"
              ($content -replace 'afxres\.h', 'winres.h') | Set-Content $_.FullName -NoNewline
            } else {
              Write-Host "No afxres.h found in $($_.FullName), skipping."
            }
          }

      - name: Build DisciplesGL
        shell: cmd
        run: |
          mkdir build_out
          msbuild src\DisciplesGL\DisciplesGL.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:VcpkgEnableManifest=true ^
            /p:OutDir="%CD%\build_out\\" ^
            /m

      - name: Package Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_package

          # 1. Copy ready-to-use files from dist/ (shaders, Imgs, Mods, etc.)
          if (Test-Path "dist") {
            Copy-Item -Path "dist\*" -Destination "dist_package" -Recurse -Force
          }

          # 2. Verify C4dll-R.dll was compiled
          if (-not (Test-Path "build_out\C4dll-R.dll")) {
            Write-Error "C4dll-R.dll was not found in build_out\!"
            exit 1
          }

          # 3. Copy C4dll-R.dll (and any runtime DLLs placed in OutDir by vcpkg)
          Copy-Item -Path "build_out\*.dll" -Destination "dist_package\" -Force

          # 4. Compress into a single ready-to-install zip
          Compress-Archive -Path "dist_package\*" -DestinationPath "DisciplesGL-Modern-Win32.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisciplesGL-Modern-Win32
          path: DisciplesGL-Modern-Win32.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: DisciplesGL-Modern (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }})
          files: DisciplesGL-Modern-Win32.zip
          generate_release_notes: true
