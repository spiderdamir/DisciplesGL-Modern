name: Auto-Sync & Build Upstream Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upstream release tag to build (e.g. 'latest' or 'v2026.6')"
        required: true
        default: "latest"
        type: string
      sync_fork:
        description: "Sync fork branch with upstream before checking"
        required: true
        default: true
        type: boolean
  schedule:
    # Check every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  check-and-sync:
    name: Sync Fork & Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.upstream.outputs.should_build }}
      tag: ${{ steps.upstream.outputs.tag }}
      title: ${{ steps.upstream.outputs.title }}

    steps:
      - name: Auto-sync fork default branch with upstream
        if: github.event_name == 'schedule' || inputs.sync_fork == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Syncing ${{ github.repository }} (${{ github.event.repository.default_branch }}) with upstream..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/merge-upstream" \
            -f branch="${{ github.event.repository.default_branch }}" \
            || echo "Sync skipped (already synced, conflict, or not a fork)."

      - name: Check latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -z "$INPUT_TAG" ] || [ "$INPUT_TAG" = "latest" ]; then
            RELEASE_JSON=$(gh api "repos/gitTerebi/DisciplesGL-Modern/releases/latest")
          else
            RELEASE_JSON=$(gh api "repos/gitTerebi/DisciplesGL-Modern/releases/tags/$INPUT_TAG")
          fi

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          TITLE=$(echo "$RELEASE_JSON" | jq -r 'if (.name // "") == "" then .tag_name else .name end')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG ($TITLE)"

          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then
            EXISTS="true"
          else
            EXISTS="false"
          fi

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$EXISTS" = "true" ]; then
            echo "Release $TAG already exists on ${{ github.repository }}. Skipping Windows build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release or manual trigger detected. Triggering build for $TAG."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    name: Build Release (${{ needs.check-and-sync.outputs.tag }})
    needs: check-and-sync
    if: needs.check-and-sync.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Fetch and checkout upstream release tag
        shell: cmd
        env:
          TAG: ${{ needs.check-and-sync.outputs.tag }}
        run: |
          git fetch https://github.com/gitTerebi/DisciplesGL-Modern.git "refs/tags/%TAG%:refs/tags/%TAG%" --force
          git checkout -f "%TAG%"
          git submodule update --init --recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Integrate vcpkg
        shell: cmd
        run: |
          vcpkg integrate install

      - name: Patch RC files if needed (afxres.h -> winres.h)
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter "*.rc" -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'afxres\.h') {
              Write-Host "Patching afxres.h -> winres.h in $($_.FullName)"
              ($content -replace 'afxres\.h', 'winres.h') | Set-Content $_.FullName -NoNewline
            } else {
              Write-Host "No afxres.h found in $($_.FullName), skipping."
            }
          }

      - name: Build DisciplesGL
        shell: cmd
        run: |
          mkdir build_out
          msbuild src\DisciplesGL\DisciplesGL.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:VcpkgEnableManifest=true ^
            /p:OutDir="%CD%\build_out\\" ^
            /m

      - name: Package Release Zip
        shell: pwsh
        env:
          TAG: ${{ needs.check-and-sync.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\dist_package"

          if (Test-Path "dist") {
            Copy-Item -Path "dist\*" -Destination "$env:RUNNER_TEMP\dist_package" -Recurse -Force
          }

          if (-not (Test-Path "build_out\C4dll-R.dll")) {
            Write-Error "C4dll-R.dll was not found in build_out\!"
            exit 1
          }

          Copy-Item -Path "build_out\*.dll" -Destination "$env:RUNNER_TEMP\dist_package\" -Force

          $zipPath = "$env:RUNNER_TEMP\DisciplesGL-Modern-$env:TAG-Win32.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\dist_package\*" -DestinationPath $zipPath -Force

      - name: Fetch upstream release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-and-sync.outputs.tag }}
        run: |
          $release = gh api "repos/gitTerebi/DisciplesGL-Modern/releases/tags/$env:TAG" | ConvertFrom-Json
          $notes = "Compiled from upstream release ``$env:TAG`` of gitTerebi/DisciplesGL-Modern.`n`n" + $release.body
          $notes | Set-Content -Path "$env:RUNNER_TEMP\upstream_notes.md" -Encoding UTF8

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisciplesGL-Modern-${{ needs.check-and-sync.outputs.tag }}-Win32
          path: ${{ runner.temp }}/DisciplesGL-Modern-${{ needs.check-and-sync.outputs.tag }}-Win32.zip

      - name: Push tag to fork
        shell: cmd
        env:
          TAG: ${{ needs.check-and-sync.outputs.tag }}
        run: |
          git push origin "refs/tags/%TAG%"

      - name: Create GitHub Release on fork
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-and-sync.outputs.tag }}
          name: ${{ needs.check-and-sync.outputs.title }}
          body_path: ${{ runner.temp }}/upstream_notes.md
          files: ${{ runner.temp }}/DisciplesGL-Modern-${{ needs.check-and-sync.outputs.tag }}-Win32.zip
